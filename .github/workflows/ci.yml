name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      # gaia/monad-clarity isn't on Packagist yet, so composer.json's repositories
      # entry points at a local path ("../Clarity"). Checking both repos out as
      # siblings under the shared workspace root reproduces that exact layout in CI.
      - name: Check out gaia/monad-skeleton
        uses: actions/checkout@v4
        with:
          path: skeleton

      - name: Check out gaia/monad-clarity
        uses: actions/checkout@v4
        with:
          repository: gaiaco-io/monad-clarity
          path: Clarity

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, json, curl, openssl, fileinfo
          coverage: none

      - name: Validate composer.json
        working-directory: skeleton
        run: composer validate --strict

      - name: Install dependencies
        working-directory: skeleton
        run: composer install --prefer-dist --no-progress

      - name: Lint
        working-directory: skeleton
        run: composer run lint

      - name: Test
        working-directory: skeleton
        run: composer run test
